<style>/* Layout: sticky app bar; one main column (max 1440). Reconcile = inputs row, result tabs, tables. Clients = list rail + editor. */
:root{--g0:#C6EFCE;--g1:#FFE699;--g2:#BDD7EE;--g3:#F8CBAD;--g4:#D9C3E8;--g5:#B7E1E1;--g6:#F4B6C2;--g7:#E2EFA0;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g0:#1F4A2E;--g1:#4D4116;--g2:#1E3A57;--g3:#533320;--g4:#40305A;--g5:#1B4747;--g6:#55263A;--g7:#3C4A1A;
  --bg:#0E1218; --surface:#171D26; --surface-2:#1C232E; --fg:#E7EBF1; --muted:#9AA5B6; --faint:#6E7A8D; --line:#2B3442; --line-2:#222B37;
  --accent:#6AA6DB; --accent-fg:#0D1620; --accent-soft:#1B2B3C; --accent-text:#8DBCE8;
  --s1:#3987E5; --s2:#D95926;
  --good:#5CC98F; --good-bg:#17332A; --warn:#F2D28B; --warn-bg:#3A2E10; --bad:#FF9A92; --bad-bg:#3C1B19; --info-bg:#1B2B3C;
  --hdr-dark:#2A2C33; --hdr-navy:#1B3557; --manual:#3A3414; --matched:#1F3A24; --total:#22392A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{--g0:#1F4A2E;--g1:#4D4116;--g2:#1E3A57;--g3:#533320;--g4:#40305A;--g5:#1B4747;--g6:#55263A;--g7:#3C4A1A;
  --bg:#0E1218; --surface:#171D26; --surface-2:#1C232E; --fg:#E7EBF1; --muted:#9AA5B6; --faint:#6E7A8D; --line:#2B3442; --line-2:#222B37;
  --accent:#6AA6DB; --accent-fg:#0D1620; --accent-soft:#1B2B3C; --accent-text:#8DBCE8;
  --s1:#3987E5; --s2:#D95926;
  --good:#5CC98F; --good-bg:#17332A; --warn:#F2D28B; --warn-bg:#3A2E10; --bad:#FF9A92; --bad-bg:#3C1B19; --info-bg:#1B2B3C;
  --hdr-dark:#2A2C33; --hdr-navy:#1B3557; --manual:#3A3414; --matched:#1F3A24; --total:#22392A;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;text-wrap:balance}
h2{font-size:17px} h3{font-size:14px} h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.num,.tnum{font-variant-numeric:tabular-nums}
/* app bar */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1440px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--s1));display:grid;place-items:center;color:#fff}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.spacer{flex:1}
.clientpick{display:flex;align-items:center;gap:8px}
.clientpick select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:600;min-width:180px;max-width:100%}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.wrap{max-width:1440px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px;min-width:0}
.wrap>*{min-width:0}
/* cards & buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card-b{padding:12px 16px 16px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent-text);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--accent-text);border-color:transparent}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--fg);min-width:0}
/* inputs row */
.inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.inputs{grid-template-columns:minmax(0,1fr)}}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;transition:border-color .12s,background .12s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .t{font-weight:600}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700}
.filelist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fileitem{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);min-width:0}
.fileitem b{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .badge{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.prodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.prodgrid{grid-template-columns:minmax(0,1fr)}}
.progress{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}
.progress i{display:block;height:100%;background:var(--good)}
/* tables */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px}
.tools input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:240px;flex:1;max-width:340px}
.tools select{max-width:260px}
.scroll{overflow:auto;max-width:100%;max-height:70vh;border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);white-space:nowrap;text-align:left;vertical-align:middle}
th{position:sticky;top:0;z-index:2;color:#fff;font-weight:600;text-align:center;background:var(--hdr-dark)}
.t-navy th{background:var(--hdr-navy)} .t-df th{background:#B5581E} .t-acc th{background:#1F4E79}
th.man{background:#B87500}
tbody tr:nth-child(even) td{background:var(--surface-2)}
td.r{text-align:right} td.c{text-align:center}
td.m,tbody tr:nth-child(even) td.m{background:var(--manual)}
td.ok,tbody tr:nth-child(even) td.ok{background:var(--matched)}
tr.hl td{outline:0;box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--accent) 12%,transparent)}
tr.sel td{box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--accent) 18%,transparent)}
td input.cell{width:100%;min-width:90px;background:transparent;border:0;border-bottom:1px dashed var(--faint);padding:2px;font-size:13px}
td input.cell.wide{min-width:200px}
td input.cell:disabled{border-bottom-color:transparent;color:var(--faint)}
tfoot td{background:var(--total);font-weight:700;position:sticky;bottom:0}
.neg{color:var(--bad);font-weight:600} .pos{color:var(--good);font-weight:600}
.mbadge{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--good-bg);color:var(--good)}
.mbadge.review{background:var(--warn-bg);color:var(--warn)}
.mbadge.none{background:var(--surface-2);color:var(--faint);cursor:default;border:1px solid var(--line)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;padding:12px 16px 16px}
@media(max-width:1000px){.sumgrid{grid-template-columns:minmax(0,1fr)}}
.sumgrid .scroll{border:1px solid var(--line);border-radius:8px;max-height:60vh}
/* chart */
.chart{width:100%;height:190px;display:block}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:260px}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);background:var(--surface);height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal{margin:auto;width:min(620px,calc(100% - 24px));max-height:90vh;overflow:auto;background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.scrim.center{justify-content:center;align-items:center}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list>*{padding:9px 12px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.list>*:last-child{border-bottom:0}
.list button.item{background:none;border:0;border-bottom:1px solid var(--line-2);cursor:pointer;text-align:left;width:100%}
.list button.item:hover{background:var(--accent-soft)}
/* clients */
.clients{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.clients{grid-template-columns:minmax(0,1fr)}}
.crail{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.citem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.citem .n{font-weight:600}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13px}
.banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.info{background:var(--info-bg);color:var(--accent-text)} .banner.good{background:var(--good-bg);color:var(--good)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.busy{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:90;display:grid;place-items:center}
.busy>div{background:var(--surface);padding:18px 22px;border-radius:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:11px 16px;border-top:1px solid var(--line-2);align-items:start}
.check .ic{font-weight:700}
details.rules{padding:12px 16px}
details.rules summary{cursor:pointer;font-weight:600}
details.rules ul{margin:8px 0 0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hero{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}

td.gc0,tbody tr:nth-child(even) td.gc0{background:var(--g0);color:var(--fg)}
td.gc1,tbody tr:nth-child(even) td.gc1{background:var(--g1);color:var(--fg)}
td.gc2,tbody tr:nth-child(even) td.gc2{background:var(--g2);color:var(--fg)}
td.gc3,tbody tr:nth-child(even) td.gc3{background:var(--g3);color:var(--fg)}
td.gc4,tbody tr:nth-child(even) td.gc4{background:var(--g4);color:var(--fg)}
td.gc5,tbody tr:nth-child(even) td.gc5{background:var(--g5);color:var(--fg)}
td.gc6,tbody tr:nth-child(even) td.gc6{background:var(--g6);color:var(--fg)}
td.gc7,tbody tr:nth-child(even) td.gc7{background:var(--g7);color:var(--fg)}

/* ============================== sheet reading ============================== */
function sheetRows(ws) {
  // returns [{get(c)}], handles dense arrays (xlsx 0.18) and sparse sheets
  if (Array.isArray(ws)) return ws.map(r => r || []).map(r => c => { const x = r[c]; return x === undefined ? undefined : x.v; });
  const ref = ws['!ref']; if (!ref) return [];
  const rg = root.XLSX.utils.decode_range(ref);
  const out = [];
  for (let R = rg.s.r; R <= rg.e.r; R++) out.push(c => { const x = ws[root.XLSX.utils.encode_cell({ r: R, c })]; return x === undefined ? undefined : x.v; });
  return out;
}
function sheetWidth(ws) {
  if (Array.isArray(ws)) { const ref = ws['!ref']; if (ref) return root.XLSX.utils.decode_range(ref).e.c + 1; return Math.max(...ws.map(r => (r ? r.length : 0))); }
  return root.XLSX.utils.decode_range(ws['!ref'] || 'A1').e.c + 1;
}
RC.sheetNames = function (buf) {
  return root.XLSX.read(buf, { type: 'array', bookSheets: true }).SheetNames;
};
RC.readSheet = function (buf, prefer) {
  const X = root.XLSX;
  const isCsv = false;
  let names; try { names = X.read(buf, { type: 'array', bookSheets: true }).SheetNames; } catch (e) { names = null; }
  const pick = names && names.find(n => prefer && n === prefer) || (names && names[0]);
  const opt = { type: 'array', dense: true, cellStyles: false, cellFormula: false, cellHTML: false, cellText: false, cellDates: false, cellNF: false, raw: true };
  if (pick) opt.sheets = pick;
  const wb = X.read(buf, opt);
  const sn = pick || wb.SheetNames[0];
  const ws = wb.Sheets[sn];
  return { ws, sheet: sn, names: names || wb.SheetNames, rows: sheetRows(ws), width: sheetWidth(ws) };
};
RC.aoa = function (buf, prefer, maxRows) {
  const sh = RC.readSheet(buf, prefer);
  const out = [];
  const n = Math.min(sh.rows.length, maxRows || 1e9);
  for (let i = 0; i < n; i++) { const g = sh.rows[i]; const r = []; for (let c = 0; c < sh.width; c++) { const v = g(c); r.push(v === undefined ? '' : v); } out.push(r); }
  return out;
};

/* ============================== PDR extraction ============================== */
const PDR_FIELDS = {
  rcpt: 'Receipt #', loc: 'Location Name', rep: 'Created By Username', date: 'Date Created', cust: 'Customer Name',
  sku: 'SKU', track: 'Tracking #', pname: 'Product Name', refund: 'Refund', qty: 'Quantity', price: 'Selling Price',
  mdr: 'MDR Amount', cat: 'Product Category', sub: 'Product Sub Category', ptype: 'Product Type', df: 'Direct Fulfillment'
};
const PDR_REQUIRED = ['rcpt', 'loc', 'date', 'pname', 'ptype', 'price'];
RC.DEFAULT_ANCHOR = 'Progressive Lease Vendor Rebate';

RC.readPDR = function (buf, opts) {
  opts = opts || {};
  const anchor = key(opts.anchor || RC.DEFAULT_ANCHOR);
  const sh = RC.readSheet(buf, 'Report_Output');
  const rows = sh.rows;
  if (!rows.length) throw new Error('The file has no rows.');
  const idx = {};
  const hdr = {};
  for (let c = 0; c < sh.width; c++) { const h = key(rows[0](c)); if (h && !(h in hdr)) hdr[h] = c; }
  for (const k in PDR_FIELDS) { const c = hdr[key(PDR_FIELDS[k])]; if (c !== undefined) idx[k] = c; }
  const miss = PDR_REQUIRED.filter(k => idx[k] === undefined).map(k => PDR_FIELDS[k]);
  if (miss.length) throw new Error('This does not look like a Sales By Product report. Missing columns: ' + miss.join(', ') + '.');
  const get = (g, k) => (idx[k] === undefined ? undefined : g(idx[k]));
  // pass 1 - which receipts matter, location coverage, date range
  const relevant = new Set();
  const locCount = new Map();
  let min = null, max = null, total = 0;
  for (let i = 1; i < rows.length; i++) {
    const g = rows[i];
    const rc = str(get(g, 'rcpt')); if (!rc) continue;
    total++;
    const loc = str(get(g, 'loc'));
    locCount.set(loc, (locCount.get(loc) || 0) + 1);
    const d = toDate(get(g, 'date'));
    if (d) { if (!min || d < min) min = d; if (!max || d > max) max = d; }
    const pn = key(get(g, 'pname')), pt = str(get(g, 'ptype'));
    if (pn === anchor || pt === 'Progressive Leasing' || pt === 'Bread Financing') relevant.add(rc);
  }
  // pass 2 - keep only lines of relevant receipts
  const lines = [];
  for (let i = 1; i < rows.length; i++) {
    const g = rows[i];
    const rc = str(get(g, 'rcpt'));
    if (!rc || !relevant.has(rc)) continue;
    lines.push({
      rcpt: rc, loc: str(get(g, 'loc')), rep: str(get(g, 'rep')), date: toDate(get(g, 'date')) || get(g, 'date'),
      cust: str(get(g, 'cust')), sku: str(get(g, 'sku')), track: get(g, 'track'), pname: str(get(g, 'pname')),
      refund: str(get(g, 'refund')), qty: get(g, 'qty'), price: num(get(g, 'price')), mdr: num(get(g, 'mdr')),
      cat: str(get(g, 'cat')), sub: str(get(g, 'sub')), ptype: str(get(g, 'ptype')), df: str(get(g, 'df'))
    });
  }
  const locs = [...locCount.entries()].map(([name, n]) => ({ name, n })).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  return { lines, meta: { sheet: sh.sheet, totalRows: total, locs, min, max, receipts: relevant.size, anchor: opts.anchor || RC.DEFAULT_ANCHOR } };
};

/* ============================== store lists & clients ============================== */
const storeNum = loc => { const m = String(loc || '').match(/^\s*(\d+)\s*:/); return m ? m[1] : ''; };
RC.storeNum = storeNum;

RC.parseStoreList = function (aoa) {
  const warn = [];
  let hr = -1, cols = {};
  const test = {
    am: /^(area\s*manager|area\s*mgr|am|manager)$/i,
    id: /^(store\s*id|loc(ation)?\s*id|id|store\s*#|store\s*no\.?|store\s*number|location\s*number)$/i,
    name: /^(store\s*names?|location\s*names?|name|store|location|locations)$/i
  };
  for (let r = 0; r < Math.min(aoa.length, 12); r++) {
    const found = {};
    aoa[r].forEach((c, i) => { const h = str(c).replace(/\s+/g, ' '); for (const k in test) if (found[k] === undefined && test[k].test(h)) found[k] = i; });
    if (Object.keys(found).length >= 1 && (found.name !== undefined || found.id !== undefined)) { hr = r; cols = found; break; }
  }
  let body;
  if (hr < 0) { body = aoa; cols = { name: 0 }; warn.push('No header row found, so the first column was read as the store list.'); } else body = aoa.slice(hr + 1);
  const stores = []; const seen = new Set();
  body.forEach(r => {
    const name = cols.name !== undefined ? str(r[cols.name]) : '';
    const idRaw = cols.id !== undefined ? str(r[cols.id]).replace(/\.0+$/, '') : '';
    const am = cols.am !== undefined ? str(r[cols.am]) : '';
    if (!name && !idRaw) return;
    let n = storeNum(name);
    if (!n && /^\d+$/.test(name)) n = String(Number(name));
    if (!n && /^\d+$/.test(idRaw)) n = idRaw.length >= 8 ? String(Number(idRaw.slice(-3))) : String(Number(idRaw));
    const k = (n || key(name));
    if (seen.has(k)) return; seen.add(k);
    stores.push({ num: n, id: idRaw, name: name || '', am });
  });
  return { stores, hasAM: cols.am !== undefined && stores.some(s => s.am), warnings: warn };
};

RC.makeMatcher = function (client) {
  const stores = (client && client.stores) || [];
  const nums = new Map(); const names = [];
  stores.forEach(s => { if (s.num) nums.set(String(Number(s.num)), s); else if (s.name) names.push({ k: key(s.name), s }); });
  const kw = key(client && client.keyword);
  const useStores = stores.length > 0;
  const fn = loc => {
    const l = key(loc);
    if (kw && !l.includes(kw)) return null;
    if (!useStores) return { s: null };
    const n = storeNum(loc);
    if (n && nums.has(String(Number(n)))) return { s: nums.get(String(Number(n))) };
    const nm = names.find(x => l.includes(x.k)); if (nm) return { s: nm.s };
    return null;
  };
  fn.restricts = useStores || !!kw;
  return fn;
};

RC.coverage = function (meta, client) {
  const m = RC.makeMatcher(client);
  const inList = [], notInList = [];
  meta.locs.forEach(l => { (m(l.name) ? inList : notInList).push(l); });
  const stores = (client && client.stores) || [];
  const present = new Set(inList.map(l => String(Number(storeNum(l.name)))));
  const missing = stores.filter(s => s.num && !present.has(String(Number(s.num))));
  return { inList, notInList, missing };
};

/* ============================== Progressive ============================== */
function groupBy(lines) { const m = new Map(); lines.forEach(l => { let a = m.get(l.rcpt); if (!a) { a = []; m.set(l.rcpt, a); } a.push(l); }); return m; }
function inRange(d, from, to) { if (!(d instanceof Date)) return true; const n = dayNum(d); if (from && n < dayNum(from)) return false; if (to && n > dayNum(to)) return false; return true; }

RC.computeProgressive = function (pdr, ctx) {
  const anchor = key(ctx.anchor || RC.DEFAULT_ANCHOR);
  const matcher = ctx.matcher || (() => ({ s: null }));
  const groups = groupBy(pdr.lines);
  const dev = [], df = [], acc = [];
  groups.forEach((ls, rcpt) => {
    const a = ls.find(l => key(l.pname) === anchor);
    if (!a) return;
    const mt = matcher(a.loc); if (!mt) return;
    const d = a.date instanceof Date ? a.date : toDate(a.date);
    let isDF = false; const names = []; let price = 0;
    ls.forEach(l => {
      if (l.ptype !== 'DEVICE') return;
      if (l.df.toUpperCase() === 'YES') isDF = true;
      if (l.refund.toUpperCase() !== 'YES') { names.push(l.pname); price += l.price; }
    });
    const row = {
      inv: rcpt, loc: a.loc, locNum: storeNum(a.loc), am: mt.s ? mt.s.am : '', rep: a.rep, dt: d, date: d ? dayOnly(d) : null,
      cust: a.cust, track: numOrText(a.track), refund: a.refund, qty: numOrText(a.qty), dev: names.join('/'), price: r2(price), total: r2(a.price), isDF,
      inP: inRange(d, ctx.from, ctx.to)
    };
    if (isDF) df.push(row); else dev.push(row);
  });
  const cmp = (a, b) => ((a.dt && b.dt) ? a.dt - b.dt : 0) || (a.inv < b.inv ? -1 : 1);
  dev.sort(cmp); df.sort(cmp);
  dev.filter(r => r.inP).forEach(r => { groups.get(r.inv).filter(l => l.ptype === 'ACCESSORY').forEach(l => acc.push({ inv: r.inv, loc: l.loc, rep: l.rep, dt: l.date instanceof Date ? l.date : toDate(l.date), cust: l.cust, track: numOrText(l.track), name: l.pname, refund: l.refund, qty: numOrText(l.qty), total: r2(l.price) })); });
  dev.forEach(r => { r.cents = toC(r.total); r.day = r.date ? dayNum(r.date) : 0; });
  return { dev, df: df.filter(r => r.inP), acc };
};

/* ============================== BreadPay ============================== */
RC.computeBread = function (pdr, ctx) {
  const matcher = ctx.matcher || (() => ({ s: null }));
  const groups = groupBy(pdr.lines);
  const sales = [], direct = [], acc = [];
  groups.forEach((ls, rcpt) => {
    if (!ls.some(l => l.ptype === 'Bread Financing')) return;
    const b = ls[0];
    const mt = matcher(b.loc); if (!mt) return;
    const d = b.date instanceof Date ? b.date : toDate(b.date);
    let bread = 0, accMdr = 0, hasAcc = false, isDirect = false; const cv = [], by = [];
    ls.forEach(l => {
      if (l.df.toUpperCase() === 'YES') isDirect = true;
      if (l.ptype === 'Bread Financing') bread += l.price;
      else if (l.ptype === 'DEVICE') { if (l.sku === 'DEFBYOD') { if (by.length < 10) by.push(l.pname); } else if (cv.length < 20) cv.push({ name: l.pname, sp: l.price, mdr: l.mdr }); }
      else if (l.cat === 'Stocked' && l.sub === 'Default') {
        accMdr += l.mdr; hasAcc = true;
        acc.push({ inv: rcpt, loc: b.loc, rep: b.rep.toUpperCase(), dt: d, cust: b.cust, name: l.pname, price: r2(l.price), mdr: r2(l.mdr) });
      }
    });
    let dev = '', price = 0, dmdr = 0;
    if (cv.length === 1 && by.length === 1) { dev = by[0]; price = 0; dmdr = cv[0].mdr; }
    else { dev = [...cv.map(x => x.name), ...by].join('/'); cv.forEach(x => { price += x.sp; dmdr += x.mdr; }); }
    const total = bread - dmdr, totalAmt = total + accMdr;
    const base = { inv: rcpt, loc: b.loc, locNum: storeNum(b.loc), am: mt.s ? mt.s.am : '', rep: b.rep.toUpperCase(), dt: d, date: d ? dayOnly(d) : null, cust: b.cust, dev, inP: inRange(d, ctx.from, ctx.to) };
    if (isDirect) { if (base.inP) direct.push(base); }
    else sales.push(Object.assign(base, {
      price: r2(price), lease: r2(bread), dmdr: r2(dmdr), total: r2(total), accMdr: (hasAcc && accMdr !== 0) ? r2(accMdr) : null,
      total: r2(total), exp: r2(dmdr), totalAmt: r2(totalAmt)
    }));
  });
  const cmp = (a, b) => ((a.dt && b.dt) ? a.dt - b.dt : 0) || (a.inv < b.inv ? -1 : 1);
  sales.sort(cmp); direct.sort(cmp);
  const set = new Set(sales.filter(s => s.inP).map(s => s.inv));
  const accKept = acc.filter(a => set.has(a.inv));
  const order = new Map(sales.map((s, i) => [s.inv, i]));
  accKept.sort((a, b) => order.get(a.inv) - order.get(b.inv));
  sales.forEach(r => { r.cents = toC(r.totalAmt); r.day = r.date ? dayNum(r.date) : 0; });
  const pivot = new Map();
  accKept.forEach(a => pivot.set(a.inv, r2((pivot.get(a.inv) || 0) + a.mdr)));
  return { sales, direct, acc: accKept, accPivot: [...pivot.entries()].map(([inv, mdr]) => ({ inv, mdr })) };
};

/* ============================== bank statements ============================== */
const RX_PROG = /PROGRESSIVE\s*LEAS|PROGRESSIVELEASE|PROG\s*LEASING|PROGLEASE/i;
const RX_BREAD = /BREAD\s*(DISB|FINANC|PAY)|BREADPAY|COMENITY\s*PAY/i;
RC.classify = function (text) { if (RX_PROG.test(text)) return 'progressive'; if (RX_BREAD.test(text)) return 'bread'; return 'other'; };

RC.parseBank = function (aoa, fileName) {
  // locate header row
  let hr = -1, c = {};
  for (let r = 0; r < Math.min(aoa.length, 15); r++) {
    const hs = aoa[r].map(x => key(x));
    const find = re => { const i = hs.findIndex(h => re.test(h)); return i < 0 ? undefined : i; };
    const date = find(/^(as-?of date|date|posted date|post date|transaction date|trans date|posting date)$/) ?? find(/^value date$/);
    const amount = find(/^(amount|transaction amount)$/);
    const credit = find(/^(credit amt|credit amount|credit|deposits?|deposit amount)$/);
    const debit = find(/^(debit amt|debit amount|debit|withdrawals?)$/);
    if (date !== undefined && (amount !== undefined || credit !== undefined)) {
      const text = []; hs.forEach((h, i) => { if (/desc|detail|memo|narr|particular|payee|originator name|text/.test(h) && !/^(account|bank)/.test(h) && i !== date) text.push(i); });
      const stat = find(/^(type|tran status|status|transaction type)$/);
      hr = r; c = { date, amount, credit, debit, text, stat, hs };
      break;
    }
  }
  if (hr < 0) throw new Error('Could not find a Date and Amount (or Credit) column in this bank file.');
  const out = [];
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r];
    const d = toDate(row[c.date]); if (!d) continue;
    let amt;
    if (c.amount !== undefined) amt = num(row[c.amount]);
    else amt = num(row[c.credit]) - (c.debit !== undefined ? num(row[c.debit]) : 0);
    if (!(amt > 0)) continue; // deposits only
    const parts = []; c.text.forEach(i => { const t = str(row[i]).replace(/\s+/g, ' '); if (t && !parts.includes(t)) parts.push(t); });
    const desc = parts.join(' | ');
    const stat = c.stat !== undefined ? str(row[c.stat]) : '';
    out.push({ date: dayOnly(d), cents: toC(amt), desc, kind: RC.classify(desc), pending: /pending/i.test(stat), file: fileName || '', row: r + 1 });
  }
  return { deposits: out, columns: { date: aoa[hr][c.date], amount: c.amount !== undefined ? aoa[hr][c.amount] : aoa[hr][c.credit] }, scanned: aoa.length - hr - 1 };
};

RC.mergeDeposits = function (files) {
  // files: [{name, deposits}] ; drops lines already seen in an earlier file (overlapping exports)
  const seen = new Map(); const out = []; let dropped = 0; let id = 1;
  files.forEach(f => {
    const local = new Map();
    f.deposits.forEach(d => {
      const k = fmtISO(d.date) + '|' + d.cents + '|' + key(d.desc).slice(0, 60);
      const prev = seen.get(k);
      if (prev && prev !== f.name) { dropped++; return; }
      local.set(k, (local.get(k) || 0) + 1);
      seen.set(k, f.name);
      out.push(Object.assign({ id: id++ }, d, { day: dayNum(d.date) }));
    });
  });
  return { deposits: out, dropped };
};

/* ============================== matching ============================== */
function subsetSearch(vals, target, tol, cap, maxSize) {
  const n = vals.length; if (!n) return [];
  const h = n >> 1; const A = vals.slice(0, h), B = vals.slice(h);
  const sums = (arr) => { const res = [{ s: 0, m: 0 }]; arr.forEach((v, i) => { const len = res.length; for (let j = 0; j < len; j++) res.push({ s: res[j].s + v, m: res[j].m | (1 << i) }); }); return res; };
  const SA = sums(A), SB = sums(B).sort((x, y) => x.s - y.s);
  const sols = [];
  for (const a of SA) {
    const need = target - a.s;
    let lo = 0, hi = SB.length - 1, pos = SB.length;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (SB[mid].s >= need - tol) { pos = mid; hi = mid - 1; } else lo = mid + 1; }
    for (let k = pos; k < SB.length && SB[k].s <= need + tol; k++) {
      if (a.m === 0 && SB[k].m === 0) continue;
      const idx = []; for (let i = 0; i < h; i++) if (a.m & (1 << i)) idx.push(i); for (let i = 0; i < B.length; i++) if (SB[k].m & (1 << i)) idx.push(h + i);
      if (maxSize && idx.length > maxSize) continue;
      sols.push(idx); if (sols.length >= cap) return sols;
    }
  }
  return sols;
}

RC.matchLots = function (items, deposits, opt) {
  opt = Object.assign({ tol: 3, subTol: 2, maxLag: 21, subLag: 14, maxSpan: 7, maxCand: 22, maxSubset: 8 }, opt || {});
  const deps = deposits.slice().sort((a, b) => a.day - b.day || a.cents - b.cents || a.id - b.id);
  const usedItem = new Set(), usedDep = new Set(); const lots = [];
  const dayMap = new Map();
  items.forEach(it => { let u = dayMap.get(it.day); if (!u) { u = { day: it.day, items: [], sum: 0, matched: false }; dayMap.set(it.day, u); } u.items.push(it); u.sum += it.cents; });
  const days = [...dayMap.values()].sort((a, b) => a.day - b.day); days.forEach((u, i) => (u.gi = i));
  const claim = (us, depList, kind, extra) => {
    us.forEach(u => { u.matched = true; u.items.forEach(it => usedItem.add(it.i)); });
    depList.forEach(d => usedDep.add(d.id));
    lots.push(Object.assign({ kind, rows: us.flatMap(u => u.items.map(it => it.i)).sort((a, b) => a - b), deps: depList.map(d => d.id) }, extra || {}));
  };
  // A) one deposit <-> one or more consecutive days
  for (const dep of deps) {
    if (usedDep.has(dep.id)) continue;
    const cand = days.filter(u => !u.matched && u.day <= dep.day && u.day >= dep.day - opt.maxLag);
    let best = null;
    for (let s = 0; s < cand.length; s++) {
      let sum = 0;
      for (let e = s; e < cand.length && e - s < opt.maxSpan; e++) {
        if (cand[e].gi - cand[s].gi !== e - s) break;
        sum += cand[e].sum;
        if (Math.abs(sum - dep.cents) <= opt.tol && sum !== 0) {
          const gap = dep.day - cand[e].day, span = e - s;
          if (!best || gap < best.gap || (gap === best.gap && span < best.span)) best = { s, e, gap, span };
        }
      }
    }
    if (best) claim(cand.slice(best.s, best.e + 1), [dep], best.s === best.e ? 'day' : 'range');
  }
  // B) two or three consecutive deposits <-> consecutive days that tie only in total
  for (const k of [2, 3]) {
    let rem = deps.filter(d => !usedDep.has(d.id));
    for (let i = 0; i + k <= rem.length; i++) {
      const win = rem.slice(i, i + k);
      if (win.some(d => usedDep.has(d.id))) continue;
      if (win[k - 1].day - win[0].day > 7) continue;
      const T = win.reduce((a, d) => a + d.cents, 0);
      const cand = days.filter(u => !u.matched && u.day <= win[k - 1].day && u.day >= win[0].day - opt.maxLag);
      let best = null;
      for (let s = 0; s < cand.length; s++) {
        let sum = 0;
        for (let e = s; e < cand.length && e - s < 5; e++) {
          if (cand[e].gi - cand[s].gi !== e - s) break;
          sum += cand[e].sum;
          if (Math.abs(sum - T) <= opt.tol * k && sum !== 0) { const gap = win[k - 1].day - cand[e].day; if (!best || gap < best.gap) best = { s, e, gap }; }
        }
      }
      if (best) { claim(cand.slice(best.s, best.e + 1), win, 'pair'); rem = deps.filter(d => !usedDep.has(d.id)); i = -1; }
    }
  }
  // C) invoice-level subset
  for (const dep of deps) {
    if (usedDep.has(dep.id)) continue;
    let cand = items.filter(it => !usedItem.has(it.i) && it.day <= dep.day && it.day >= dep.day - opt.subLag);
    if (!cand.length) continue;
    cand.sort((a, b) => b.day - a.day || b.i - a.i); cand = cand.slice(0, opt.maxCand);
    const sols = subsetSearch(cand.map(x => x.cents), dep.cents, opt.subTol, 400, opt.maxSubset);
    if (!sols.length) continue;

  const lo = P.rows.length ? Math.min(...P.rows.map(r => r.day)) : 0, hi0 = P.rows.length ? Math.max(...P.rows.map(r => r.day)) : 0;
  P.deps.forEach(d => { if (!d.late && d.day <= hi0 + 21) dep.set(d.day, (dep.get(d.day) || 0) + d.cents); });
  const hi = Math.max(hi0, ...[...dep.keys(), lo]); const days = []; for (let d = Math.max(lo, hi - 120); d <= hi; d++) days.push({ d, s: sales.get(d) || 0, b: dep.get(d) || 0 });

function checks() {

  if (!S.res) return out;

  ['pl', 'bp'].forEach(p => {
    const P = S.res[p], name = PRODS[p].name, k = P.k;

    else {
      out.push({ level: k.unCents ? 'warn' : 'good', t: `${name}: ${k.unRows} invoice${k.unRows === 1 ? '' : 's'} not matched to a deposit`, d: k.unRows ? `${dollars(k.unCents)} of sales still waiting for a bank deposit (recent sales may simply not have paid out yet).` : 'Every invoice is matched to a deposit.', go: [p, 'unmatched'] });

      const bad = P.groups.filter(g => Math.abs(g.bank - g.sum) > 2 && g.anchor != null).length; if (bad) out.push({ level: 'bad', t: `${name}: ${bad} group${bad === 1 ? '' : 's'} with a difference`, d: 'Bank and matched sales differ by more than 2 cents.', go: [p, 'diff'] });
      if (!bad && !rev) out.push({ level: 'good', t: `${name}: all matched groups tie to the cent`, d: '' });
    }
    const ref = P.rows.filter(r => p === 'pl' && String(r.refund).toUpperCase() === 'YES').length; if (ref) out.push({ level: 'info', t: `${name}: ${ref} refunded invoice${ref === 1 ? '' : 's'}`, d: 'Refunded lines are excluded from device price but the anchor total still applies.' });
    const neg = P.rows.filter(r => r.cents < 0).length; if (neg) out.push({ level: 'warn', t: `${name}: ${neg} invoice${neg === 1 ? '' : 's'} with a negative total`, d: 'Usually a return or reversal. Check against the bank.' });
    if (P.extra.df.length) out.push({ level: 'info', t: `${name}: ${P.extra.df.length} direct fulfilment receipt${P.extra.df.length === 1 ? '' : 's'}`, d: 'Excluded from the bank match and exported on their own sheet.' });
  });
  if (cov.missing.length) out.push({ level: 'info', t: `${cov.missing.length} listed store${cov.missing.length === 1 ? '' : 's'} with no sales`, d: cov.missing.slice(0, 12).map(s => s.name || s.num).join(', ') + (cov.missing.length > 12 ? '…' : '') });
  if (S.banks.length && S.allDeps) { const o = S.allDeps.filter(d => d.kind === 'other').length; if (o) out.push({ level: 'info', t: `${o} deposit${o === 1 ? '' : 's'} not recognised as Progressive or BreadPay`, d: 'They are ignored. Reclassify in Bank deposits if one belongs to this reconciliation.', go: ['bank', 'other'] }); const pe = S.allDeps.filter(d => d.pending).length; if (pe) out.push({ level: 'warn', t: `${pe} pending bank line${pe === 1 ? '' : 's'}`, d: 'Pending deposits may change once posted.' }); }

async function loadPDR(file) {

}
async function readStoreFile(f) { const buf = await readBuf(f); return RC.parseStoreList(RC.aoa(buf)); }

document.addEventListener('click', async e => {

  if (d.kind) { const dep = S.allDeps.find(x => x.id === +d.kind); S.kindOver[depKey(dep)] = t.value; LS.set('rd2.kind', S.kindOver); return refresh(); }
  if (d.ed) {
    const p = V.sec, inv = d.inv; let val = t.value;
    if (d.ed === 'bank') { if (String(val).trim() === '') val = ''; else { const n = readAmt(val); if (n == null) { toast('Enter a number.'); return renderResults(); } val = n; } }
    setEdit(p, inv, d.ed, val);
    if (d.ed === 'bank' || d.ed === 'cred') { compute(); render(); } else { S.res[p].ed = getEd(p); renderResults(); }
    return;
  }
  if (d.ce) { const E = ensureEdit(); E[d.ce] = t.value; E.dirty = true; return render(); }
  if (d.sf !== undefined) { const E = ensureEdit(); E.stores[+d.i][d.sf] = t.value; if (d.sf === 'name' && !E.stores[+d.i].num) E.stores[+d.i].num = RC.storeNum(t.value); E.dirty = true; return render(); }
});
/* drag & drop */
document.addEventListener('dragover', e => { const z = e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('over'); const fs = [...e.dataTransfer.files]; if (!fs.length) return;
  if (z.dataset.drop === 'pdr') loadPDR(fs[0]); else if (z.dataset.drop === 'bank') loadBank(fs); else if (z.dataset.drop === 'stores') editorStores(fs[0]);
});
/* group hover */
let hlG = null;
document.addEventListener('mouseover', e => {
  const tr = e.target.closest('tr[data-g]'); const g = tr && tr.dataset.g; if (g === hlG || (!g && !hlG)) return;
  $$('tr.hl').forEach(x => x.classList.remove('hl')); hlG = g || null;
  if (g) $$(`tr[data-g="${g}"]`, tr.closest('table')).forEach(x => x.classList.add('hl'));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; renderOverlay(); } });
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(drawChart, 150); });

/* init */
document.addEventListener('submit', e => { e.preventDefault(); });
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-login]'); if (!a || !window.CLOUD) return;
  const email = ($('#li-email') || {}).value || '', pass = ($('#li-pass') || {}).value || '';
  if (a.dataset.login === 'reset') { if (!email) return toast('Enter your email first.'); try { await window.CLOUD.reset(email); toast('Password reset email sent'); } catch (x) { toast('Could not send the reset email.'); } return; }
  if (a.dataset.login === 'out') { await window.CLOUD.signOut(); return; }
  try { S.authMsg = ''; await window.CLOUD.signIn(email, pass); } catch (x) { S.authMsg = 'Email or password not recognised.'; render(); }
});
let cloudPending = false;
window.onCloudReady = () => { loadData(); S.auth = 'in'; S.user = window.CLOUD.email(); S.authMsg = ''; render(); };
window.onCloudSignedOut = () => { S.auth = 'out'; S.user = ''; S.pdr = null; S.res = null; S.banks = []; render(); };
window.onCloudError = msg => { S.auth = 'out'; S.authMsg = msg; render(); };
window.onCloudChange = () => {
  if (S.auth !== 'in') return;
  if (S.edit && S.edit.dirty) { S.kindOver = LS.get('rd2.kind', {}); return; }
  const ae = document.activeElement; if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && ae.type !== 'checkbox') { cloudPending = true; return; }
  const keep = S.cur; S.clients = window.CLOUD.clients(); S.kindOver = LS.get('rd2.kind', {});
  if (!S.clients.some(c => c.id === keep)) S.cur = S.clients[0].id; S.edit = null;
  compute(); render();
};
document.addEventListener('focusout', () => { if (cloudPending) setTimeout(() => { if (!/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) { cloudPending = false; window.onCloudChange(); } }, 200); });
(function init() {
  const t = LS.get('rd2.theme', null); if (t) document.documentElement.dataset.theme = t;
  if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey) { S.auth = 'loading'; render(); }
  else { loadData(); render(); }
})();
</script></body></html>
